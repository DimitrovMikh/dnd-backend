services:
  db:
    image: postgres:16-alpine
    container_name: dnd_postgres
    environment:
      - POSTGRES_USER=dnd_user
      - POSTGRES_PASSWORD=dnd_password
      - POSTGRES_DB=dnd_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd_user -d dnd_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  backend:
    build: ./backend
    container_name: dnd_backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://dnd_user:dnd_password@db:5432/dnd_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: