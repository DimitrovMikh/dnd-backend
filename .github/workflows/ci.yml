name: CI Quality Control
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: |
        pip install ruff
        ruff check backend/
  
  type-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: |
        pip install -r backend/requirements.txt
        mypy --ignore-missing-imports backend/app
  
  test:
    needs: [lint, type-check]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run:
        pip install -r backend/requirements.txt
    - name: Run Pytest
      env:
        SECRET_KEY: "test-secret-key-ci"
      run: |
        cd backend
        pytest